name: E2E Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Kafka ${{ matrix.kafka-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAFKA_VERSION: ${{ matrix.kafka-version }}
    strategy:
      fail-fast: false
      matrix:
        kafka-version:
          - "4.2.1"
          - "4.3.1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate SSH key
        id: ssh-key
        run: bash test/e2e/scripts/generate-ssh-key.sh

      - name: Generate TLS certificates
        id: tls-certs
        run: bash test/e2e/scripts/generate-tls-certs.sh

      - name: Prepare k8s manifest
        env:
          KAFKA_VERSION: ${{ matrix.kafka-version }}
          SSH_PUBLIC_KEY_FILE: ${{ steps.ssh-key.outputs.ssh-key-path }}.pub
          SSHD_CONFIG_PATH: ${{ github.workspace }}/test/e2e/kafka/ssh/sshd_config.d
          SASL_CONFIG_PATH: ${{ github.workspace }}/test/e2e/kafka/sasl
          TLS_CERTS_PATH: ${{ steps.tls-certs.outputs.tls-certs-path }}
        run: bash test/e2e/scripts/prepare-k8s-manifest.sh

      - name: Start podman pod
        run: |
          podman kube play --build=false test/e2e/kafka/pod.yaml
        timeout-minutes: 5

      - name: Wait for Kafka to be ready
        run: bash test/e2e/scripts/wait-for-kafka.sh

      - name: Wait for SSH to be ready
        env:
          SSH_KEY_PATH: ${{ steps.ssh-key.outputs.ssh-key-path }}
        run: bash test/e2e/scripts/wait-for-ssh.sh

      - name: Run E2E tests
        env:
          SSH_TEST_KEY_PATH: ${{ steps.ssh-key.outputs.ssh-key-path }}
          KAFKA_CLI_BINARY: ${{ github.workspace }}/kafka
          TLS_TEST_CA_CERT: ${{ steps.tls-certs.outputs.ca-cert-path }}
        run: |
          go build -o ./kafka ./cmd/kafka
          go test -v -timeout 300s ./test/e2e/...

      - name: Collect pod logs on failure
        if: failure()
        run: |
          podman logs kafka-ssh-ssh || true
          podman logs kafka-ssh-kafka-ssh-test || true

      - name: Stop pod
        if: always()
        run: |
          podman kube down test/e2e/kafka/pod.yaml || true
